<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Akka Cluster - Chat Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #queryInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #queryInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #666;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 LLM Akka Cluster</h1>
            <p>Distributed AI Chat System</p>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="message assistant">
                <div class="message-bubble">
                    Hello! I'm an AI assistant running on an Akka Cluster. Ask me anything!
                </div>
            </div>
        </div>
        <div class="status" id="status">Ready</div>
        <div class="input-area">
            <input 
                type="text" 
                id="queryInput" 
                placeholder="Type your message here..."
                autocomplete="off"
            >
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const queryInput = document.getElementById('queryInput');
        const sendButton = document.getElementById('sendButton');
        const status = document.getElementById('status');
        
        // Track if a request is in progress to prevent duplicate calls
        let isRequestInProgress = false;
        let lastRequestTime = 0;
        const MIN_REQUEST_INTERVAL = 2000; // Minimum 2 seconds between requests

        function addMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function setStatus(text) {
            status.textContent = text;
        }

        function setLoading(loading) {
            isRequestInProgress = loading;
            sendButton.disabled = loading;
            queryInput.disabled = loading;
            if (loading) {
                sendButton.innerHTML = '<div class="loading"></div>';
            } else {
                sendButton.textContent = 'Send';
            }
        }

        async function sendQuery() {
            const query = queryInput.value.trim();
            if (!query) return;
            
            // Prevent duplicate requests
            if (isRequestInProgress) {
                console.log('Request already in progress, ignoring duplicate call');
                return;
            }
            
            // Rate limiting: prevent requests too close together
            const now = Date.now();
            const timeSinceLastRequest = now - lastRequestTime;
            if (timeSinceLastRequest < MIN_REQUEST_INTERVAL) {
                const waitTime = Math.ceil((MIN_REQUEST_INTERVAL - timeSinceLastRequest) / 1000);
                setStatus(`Please wait ${waitTime} second${waitTime > 1 ? 's' : ''} before sending another message`);
                return;
            }
            
            lastRequestTime = now;

            // Add user message
            addMessage(query, true);
            queryInput.value = '';
            setLoading(true);
            setStatus('Processing...');

            try {
                console.log('Sending request to API...');
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('Received response:', data);
                
                if (data.success) {
                    addMessage(data.response, false);
                    setStatus(`Session: ${data.sessionId ? data.sessionId.substring(0, 8) : 'N/A'}...`);
                } else {
                    const errorMsg = data.error || data.message || 'Unknown error';
                    // Format error message for better display (preserve line breaks)
                    const formattedError = errorMsg.replace(/\n/g, '<br>');
                    addMessage('Error: ' + formattedError, false);
                    setStatus('Error occurred');
                    console.error('API Error:', errorMsg);
                    
                    // If rate limit, suggest waiting
                    if (errorMsg.toLowerCase().includes('rate limit')) {
                        setTimeout(() => {
                            setStatus('Ready (wait before retrying)');
                        }, 5000);
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                let errorMsg = 'Error: ' + error.message;
                if (error.message.includes('Failed to fetch')) {
                    errorMsg = 'Cannot connect to server. Please check if the server is running on port 8080.';
                }
                addMessage(errorMsg, false);
                setStatus('Connection error');
            } finally {
                setLoading(false);
                // Reset after a short delay to allow UI to update
                setTimeout(() => {
                    queryInput.focus();
                }, 100);
            }
        }

        // Prevent multiple event listeners and duplicate calls
        sendButton.addEventListener('click', (e) => {
            e.preventDefault();
            sendQuery();
        });
        
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendButton.disabled && !isRequestInProgress) {
                e.preventDefault();
                sendQuery();
            }
        });
    </script>
</body>
</html>
